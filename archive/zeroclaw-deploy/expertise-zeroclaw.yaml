# Migration: OpenClaw (Lightsail, dead) → ZeroClaw (EC2 CDK, active)

overview:
  description: "ZeroClaw - Rust rewrite of OpenClaw. Sub-5MB binary, <10ms startup, built-in OpenClaw compatibility layer."
  version: "0.1.7"
  website: "https://github.com/zeroclaw-labs/zeroclaw"
  status: "active (22 ok, 2 warnings, 0 errors)"
  binary_size: "8.8MB"
  memory_usage: "<5MB RSS"
  startup_time: "<10ms"
  primary_use_cases:
    - "Long-running autonomous coding projects"
    - "Multi-agent orchestration"
    - "Background task automation"
    - "Remote development workflows"
    - "Customer-facing AI agent gateway"
  default_model_our_instance: "deepseek/deepseek-chat"
  note: "Uses OpenRouter as LLM provider. Model IDs sent directly to OpenRouter without prefix."

  migration_from_openclaw:
    old_platform: "OpenClaw v2026.2.19-2 on Lightsail (18.234.126.236)"
    old_status: "DEAD — instance unreachable as of 2026-03-02"
    old_cost: "$24/month (4GB Lightsail)"
    new_platform: "ZeroClaw v0.1.7 on EC2 t3.medium (13.223.130.153)"
    new_cost: "~$30/month (EC2 t3.medium, EBS GP3, Elastic IP)"
    key_differences:
      - "Rust binary vs Node.js (npm)"
      - "config.toml vs openclaw.json"
      - "CDK deploy vs manual SSH setup"
      - "SSM access vs SSH key access"
      - "zeroclaw daemon vs openclaw gateway"
