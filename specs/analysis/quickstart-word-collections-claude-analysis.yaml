notable_patterns:
  - name: Task-Driven Development Methodology
    description: All work flows through Archon task management system starting with task discovery, status updates during work, and research before implementation

  - name: PRP-Based Implementation
    description: Two-stage process (generate-prp, execute-prp) ensuring one-pass implementation success through comprehensive research and context documentation

  - name: Multi-Agent Orchestration
    description: Specialized agents for different concerns (architecture, database, testing, documentation) that can be invoked during PRP generation and execution

  - name: Comprehensive Test Generation
    description: Systematic test generation based on existing patterns, edge case discovery, and coverage analysis rather than ad-hoc test writing

  - name: Context Preservation
    description: Agents designed to preserve critical context and avoid token waste by returning only essential information to the main orchestrator

  - name: Pattern Discovery
    description: Commands and agents systematically discover existing project patterns (test frameworks, naming conventions, architecture styles) before implementing new features

  - name: Conventional Commits
    description: Enforced commit message format (feat, fix, docs, style, refactor, test, chore, perf, ci, build, revert) with intelligent commit splitting for logical changes

  - name: Specification-Driven Architecture
    description: Clear separation between specification generation (scoping agents) and implementation (execute-prp command with validation gates)

  - name: AWS-First Infrastructure
    description: RevStar scoping agent specifically targets AWS services (Amplify, Cognito, S3, Bedrock, CloudWatch) for QuickStart projects

  - name: One-Pass Success Focus
    description: Every command and agent optimizes for success on first attempt through comprehensive research, context curation, and validation gates

observability:
  logging_setup:
    - Controlled bash execution within sandbox permissions
    - Test output captured and analyzed
    - Failure analysis with root cause identification
    - Coverage metrics tracked and reported

  monitoring:
    - Test execution status tracking
    - Coverage analysis and gaps identified
    - Performance benchmarks in tests
    - Flaky test detection
    - Validation gate status monitoring
    - Task status tracking in Archon

  error_handling:
    - Comprehensive failure analysis in test-runner
    - Root cause identification before fixes
    - Progressive validation gates in PRP execution
    - Recovery protocols for validation failures
    - Archon task status for blocking issues

recommendations:
  strengths:
    - Exceptional structure for one-pass implementation success with PRP methodology
    - Comprehensive multi-agent system covering all development concerns
    - Strong integration with Archon for task-driven development
    - Clear patterns for test generation and database design
    - Detailed context preservation to minimize token usage
    - RevStar QuickStart methodology alignment for AWS projects
    - Excellent safety mechanisms (dry-run, validation gates, permission-based execution)

  best_practices_demonstrated:
    - Research-first approach before implementation (PRP generation)
    - Systematic pattern discovery in codebases
    - Comprehensive test coverage strategies
    - Architecture-first design approach
    - Documentation generation from code
    - Progressive validation gates
    - Clear role separation between agents

  areas_for_enhancement:
    - Consider adding CI/CD pipeline generation agent
    - Could benefit from performance profiling agent
    - Security audit agent would complement architecture-planner
    - Dependency analysis and vulnerability scanning agent
    - Load testing and scalability analysis agent
    - API versioning and deprecation agent

  workflow_optimization_tips:
    - Always start with Archon task management (explicitly required)
    - Run generate-prp for new features (2-3 hours) before execute-prp (4-6 hours)
    - Use revstar-scoping-agent specifically for AWS QuickStart projects
    - Run test-generator immediately after generate-prp to establish coverage baselines
    - Use architecture-planner for any new components above microservice level
    - Leverage database-architect early in feature design for data-heavy features
    - Generate documentation right after implementation while context is fresh
    - Use test-runner as final validation before commit

  mcp_setup_critical_items:
    - AWS credentials must have pricing:* permissions for aws-pricing MCP
    - GraphViz installation required for diagram generation
    - uv package manager must be in PATH
    - Python 3.10 required for MCP servers
    - Windows vs. Linux command variants must match system

execution_flow_recommended:
  new_feature_workflow:
    1: "Create Archon task in 'todo' status"
    2: "Update Archon task to 'doing'"
    3: "Run generate-prp with deep codebase research"
    4: "Run revstar-scoping-agent if AWS project (outputs to scope/agent-yaml/{timestamp}/)"
    5: "Run architecture-planner for system design"
    6: "Run database-architect for data modeling"
    7: "Execute execute-prp with 4-level validation gates"
    8: "Run test-generator for comprehensive coverage"
    9: "Run documentation-generator after implementation"
    10: "Create feature branch with branch-start"
    11: "Make changes per PRP guidance"
    12: "Run test-runner for validation"
    13: "Create conventional commit with commit command"
    14: "Update Archon task status to 'review' when ready for review"

agent_invocation_scenarios:
  scoping_agent: New projects without RevStar methodology
  revstar_scoping_agent: AWS QuickStart projects (preferred over scoping-agent)
  architecture_planner: New feature starting, microservice planning, architectural challenges
  database_architect: Data-heavy features, performance issues, schema design
  test_generator: After feature implementation, before PRs, low coverage areas
  test_runner: After any code changes, before commits, CI integration
  documentation_generator: After implementation, before releases, onboarding new members

commands_quick_reference:
  branch_start: "Generate feature branch from base branch with tracking setup"
  branch_cleanup: "Analyze and clean up merged/stale branches with safety"
  generate_prp: "Create comprehensive PRP with research and context (2-3 hours)"
  execute_prp: "Implement PRP-specified features with validation gates (4-6 hours)"
  commit: "Create conventional commits with intelligent splitting"
  test: "Generate comprehensive test suites with edge cases"
  unit_test: "Generate focused unit tests for specific functions"

git_workflow_integration:
  branch_naming: [feature/, bugfix/, hotfix/, chore/] with optional [ticket-id]-[description]
  commit_format: conventional commits (feat, fix, docs, style, refactor, test, chore, perf, ci, build, revert)
  workflow_safety:
    - No uncommitted changes allowed before branch operations
    - Branch merged verification before deletion
    - Dry-run mode available for cleanup
    - Remote tracking setup automatic
    - Base branch pull before feature branch creation
