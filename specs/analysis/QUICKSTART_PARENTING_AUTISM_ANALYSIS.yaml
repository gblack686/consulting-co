---

notable_patterns:

  architecture_patterns:
    - pattern: Parameterized Configuration
      description: Single source of truth (settings.local.json) with multiple access patterns
      implementation:
        - Python config_loader.py for programmatic access
        - {{VARIABLE_NAME}} template syntax for markdown commands
        - Environment variable overrides for testing/CI
      benefit: Eliminates hardcoded values, enables easy project cloning

    - pattern: Task-Driven Development (Archon-First)
      description: All work must flow through Archon task management system
      implementation:
        - Archon rules.md overrides ALL other instructions
        - Mandatory workflow: Get Task → Start Work → Research → Implement → Review
        - RAG knowledge base integration for research phase
        - Never use TodoWrite (uses Archon instead)
      benefit: Systematic task tracking, knowledge base integration, evidence-based work

    - pattern: Specialized Agent Coordination
      description: Domain-specific agents for focused problem-solving
      implementation:
        - 25+ agent definitions covering frontend, backend, infrastructure, testing, docs
        - Multi-agent workflows chain agents sequentially
        - Agent design patterns follow single responsibility principle
        - MCP server access controlled per agent
      benefit: Expert-level guidance per domain, composable workflows

    - pattern: Multi-Phase Command Workflows
      description: Complex commands broken into clear implementation phases
      example_ado_log_time:
        phase_1: Check ADO Board State
        phase_2: Analyze AWS Service Activity
        phase_3: Generate Time Entry Suggestions
        phase_4: Log Time to ADO
        phase_5: Sync Calendar Meetings
      benefit: Systematic, verifiable, auditable workflow

    - pattern: Skill-Based Capability Separation
      description: Reusable, self-contained capabilities distributed as skills
      implementations:
        - aws-cdk-diagram: Infrastructure visualization
        - git-wizard: Crisis recovery and debugging
        - handoff: Client deliverables generation
        - qa-hardening: Quality assurance utilities
      benefit: Modularity, reusability across projects, focused expertise

    - pattern: Evidence-Based Time Tracking
      description: Time entries linked to actual AWS service activity
      implementation:
        - CloudWatch log volume analysis
        - Service modification timestamps
        - Deployment change set details
        - Lambda invocation patterns
      benefit: Accountability, audit trail, prevents guessing

    - pattern: Company Policy Alignment
      description: Time tracking follows specific company policies (child tasks)
      rules:
        - Create child tasks under parent work items (not direct logging)
        - Title format: "AI - {name} - MMddYYYY"
        - One child task per day per work item
        - Close daily (not weekly)
        - Required fields: Title, AssignedTo, State, IterationPath, CompletedWork, Activity, TeamCode
      benefit: Compliance, audit readiness, integration with company systems

  development_patterns:
    - pattern: PRP-Driven Implementation
      description: Project Research Plans guide systematic, one-pass implementation
      methodology:
        - Deep codebase analysis
        - External research and documentation gathering
        - Template-based structure
        - Quality gates before implementation
        - Information density standards
      benefit: Higher success rate, reduced rework, knowledge capture

    - pattern: Knowledge Base Integration
      description: Local documentation serves as agent reference materials
      structure:
        - aws/: AWS service patterns and best practices
        - deployment/: Deployment procedures and troubleshooting
        - frontend/: React patterns and component strategies
        - testing/: Test methodology and patterns
      usage: Agents reference knowledge base before suggesting changes

    - pattern: Git Crisis Recovery
      description: Systematic approach to Git problem resolution
      steps:
        1. Crisis snapshot (backup current state)
        2. Gather intelligence (commit range identification)
        3. Diff analysis (find breaking changes)
        4. Root cause identification (manual review or git bisect)
        5. Recovery strategy formulation
        6. Testing in isolation (worktrees)
        7. Documentation and commit
      benefit: Safe recovery, prevents data loss, knowledge retention

    - pattern: Client Handoff Standardization
      description: Structured handoff materials generation
      components:
        - Slides 5-8 of 16-slide presentation (developer content)
        - Access checklist (actual resource names/URLs)
        - Next steps documentation (enhancement opportunities)
        - Updated README (preserves original, timestamped)
        - Deployment guide
      benefit: Consistent deliverables, client readiness, support clarity

  best_practices_demonstrated:
    - practice: Single Source of Truth
      implementation: settings.local.json with config_loader.py access layer
      evidence: PARAMETERIZATION_GUIDE.md, QUICK_REFERENCE.md

    - practice: Task Lifecycle Management
      implementation: Archon task workflow (todo → doing → review → done)
      evidence: archon_rules.md

    - practice: Systematic Code Analysis
