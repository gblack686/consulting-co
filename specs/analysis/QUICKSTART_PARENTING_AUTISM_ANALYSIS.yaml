      exclusions: Personal time (lunch, breaks, focus)
      correlation: Meeting duration → time entry

  monitoring:
    weekly_time_tracking:
      metric: Hours logged per week vs 20-hour target
      tool: /ado-log-time --review mode
      output: Weekly summary with status (on-target, under, over)
      automation: Recommended daily EOD execution

    board_snapshot:
      purpose: Capture board state for progress tracking
      frequency: Manual via generate_board_snapshot.py
      usage: Week review reports, progress documentation

    aws_service_activity:
      lambda_updates: List of modified Lambda functions
      s3_bucket_changes: Bucket creation and modification timestamps
      cloudformation_stacks: Stack status and update times
      correlation: Service changes linked to time entries

    task_status_tracking:
      archon_dashboard: Task status (todo/doing/review/done)
      priority_management: Task order field (0-100)
      progress_visibility: Project completion percentage

    error_tracking:
      ado_errors: Task creation failures, invalid fields
      aws_errors: CloudWatch log volume detection, service issues
      calendar_errors: Meeting sync failures, duplicate detection
      reporting: Detailed error messages in command output

