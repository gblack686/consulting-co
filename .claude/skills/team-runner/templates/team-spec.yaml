# Team Runner Spec — generated by Phase 1 planning session
# Edit this file, then approve to proceed to Phase 2 (build) and Phase 3 (run)

version: 1
project:
  name: ""                          # e.g., "eagle-app"
  path: ""                          # Mac Mini path, e.g., "~/repos/eagle-app"
  knowledge_base: ""                # Optional: path to existing KB or context files

team_type: ""                       # ceo-board | multi-team | ui-gen

# ── Execution Config ──
execution:
  strategy: sequential              # sequential | parallel | round-robin
  max_rounds: 1                     # For ceo-board: number of deliberation rounds
  timeout_per_agent: 300            # seconds
  total_budget_tokens: 500000       # total token ceiling for the run
  parallel_safe: false              # set true + --no-session if Pi lockfile is handled

# ── Brief (ceo-board only) ──
brief:
  dir: ""                           # e.g., ".pi/ceo-agents/briefs/2026-03-18-solo-plugin-bet"
  inline: ""                        # Or paste brief text directly

# ── Department ──
department:
  id: ""                            # kebab-case, e.g., "eagle-board"
  name: ""                          # Display name in Claw Empire
  icon: ""                          # Emoji
  color: ""                         # Hex color

# ── Agents ──
# Each agent maps to:
#   - A Claw Empire agent (visual tracking)
#   - An AI-Agent-KB entry (Obsidian archive)
#   - A pi -p invocation during execution
agents:
  - name: ""
    role: team_leader               # team_leader | senior | junior
    model: claude-opus-4-6          # Model to use (routes through bridge)
    avatar: ""                      # Emoji
    personality: ""                 # One-line personality/bias description
    system_prompt_file: ""          # Path to .md file on Mac Mini (optional)
    system_prompt_inline: ""        # Or inline system prompt
    max_tokens: 4096                # Per-call token limit
    consult_when: ""                # When should this agent be called
    expertise_files: []             # Paths to expertise/scratch pad files

# ── Output ──
output:
  dir: ""                           # Where to save results on Mac Mini
  commit: true                      # Git commit after run
  commit_message: ""                # Auto-generated if empty
  playground: false                 # Generate interactive HTML report
  wiki_log: true                    # Append to ~/repos/wiki/team-runs.md

# ── Shared Context ──
# Files loaded into every agent's context
shared_context: []
