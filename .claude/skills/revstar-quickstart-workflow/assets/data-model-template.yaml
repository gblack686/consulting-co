# Data Model Template for RevStar QuickStart Projects

project_name: "Example Project"
version: "1.0"

# DynamoDB Tables
tables:
  - name: "Users"
    partition_key:
      name: "PK"
      type: "String"
      description: "USER#{user_id}"
    sort_key:
      name: "SK"
      type: "String"
      description: "PROFILE or SETTINGS#{setting_id}"
    attributes:
      - name: "email"
        type: "String"
        required: true
      - name: "name"
        type: "String"
        required: true
      - name: "created_at"
        type: "String"  # ISO timestamp
        required: true
      - name: "updated_at"
        type: "String"
        required: true
      - name: "status"
        type: "String"
        values: ["active", "inactive", "suspended"]
    gsi:
      - index_name: "EmailIndex"
        partition_key: "email"
        projection: "ALL"
    access_patterns:
      - "Get user by ID"
      - "Get user by email"
      - "List user settings"

  - name: "Documents"
    partition_key:
      name: "PK"
      type: "String"
      description: "DOC#{document_id}"
    sort_key:
      name: "SK"
      type: "String"
      description: "METADATA or VERSION#{version_id}"
    attributes:
      - name: "user_id"
        type: "String"
        required: true
      - name: "title"
        type: "String"
        required: true
      - name: "s3_key"
        type: "String"
        required: true
      - name: "document_type"
        type: "String"
        values: ["pdf", "docx", "xlsx"]
      - name: "upload_date"
        type: "String"
        required: true
      - name: "file_size"
        type: "Number"
        required: true
      - name: "status"
        type: "String"
        values: ["uploaded", "processing", "completed", "failed"]
    gsi:
      - index_name: "UserDocumentsIndex"
        partition_key: "user_id"
        sort_key: "upload_date"
        projection: "ALL"
    access_patterns:
      - "Get document by ID"
      - "List user documents"
      - "Query documents by status"

# S3 Buckets
s3_buckets:
  - name: "{project}-raw-{account-id}-{region}"
    purpose: "Store raw uploaded documents"
    versioning: true
    encryption: "AES256"
    lifecycle_rules:
      - name: "DeleteOldVersions"
        noncurrent_version_expiration_days: 90
    event_notifications:
      - event: "s3:ObjectCreated:*"
        destination: "lambda"
        function: "document-processor"

  - name: "{project}-processed-{account-id}-{region}"
    purpose: "Store processed documents"
    versioning: true
    encryption: "AES256"
    lifecycle_rules:
      - name: "TransitionToIA"
        transition_days: 30
        storage_class: "INTELLIGENT_TIERING"

# Data Relationships
relationships:
  - name: "User to Documents"
    type: "one-to-many"
    from: "Users"
    to: "Documents"
    foreign_key: "user_id"

# Sample Data Structure
sample_data:
  users:
    - PK: "USER#123"
      SK: "PROFILE"
      email: "john@example.com"
      name: "John Doe"
      created_at: "2025-01-15T10:00:00Z"
      status: "active"

  documents:
    - PK: "DOC#456"
      SK: "METADATA"
      user_id: "USER#123"
      title: "Q4 Report"
      s3_key: "documents/456/q4-report.pdf"
      document_type: "pdf"
      upload_date: "2025-01-20T14:30:00Z"
      file_size: 2048000
      status: "completed"
