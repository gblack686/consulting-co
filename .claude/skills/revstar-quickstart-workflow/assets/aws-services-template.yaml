# AWS Services Architecture Template for RevStar QuickStart Projects

project_name: "Example Project"
version: "1.0"
environment: "dev"  # dev, staging, prod

# Compute Services
compute:
  lambda_functions:
    - name: "document-processor"
      runtime: "python3.11"
      memory: 512
      timeout: 300
      environment_variables:
        LOG_LEVEL: "INFO"
        TABLE_NAME: "${DocumentsTable}"
      triggers:
        - type: "s3"
          bucket: "${RawBucket}"
          events: ["s3:ObjectCreated:*"]
      permissions:
        - service: "s3"
          actions: ["s3:GetObject"]
          resources: ["${RawBucket}/*"]
        - service: "dynamodb"
          actions: ["dynamodb:PutItem", "dynamodb:UpdateItem"]
          resources: ["${DocumentsTable}"]

    - name: "api-handler"
      runtime: "python3.11"
      memory: 256
      timeout: 30
      environment_variables:
        TABLE_NAME: "${UsersTable}"
      triggers:
        - type: "api-gateway"
          path: "/api/{proxy+}"
          method: "ANY"
      permissions:
        - service: "dynamodb"
          actions: ["dynamodb:GetItem", "dynamodb:PutItem", "dynamodb:Query"]
          resources: ["${UsersTable}", "${UsersTable}/index/*"]

  glue_jobs:
    - name: "data-transformation"
      type: "PySpark"
      glue_version: "4.0"
      worker_type: "G.1X"
      number_of_workers: 2
      max_retries: 1
      timeout: 60
      script_location: "s3://${ScriptsBucket}/glue-jobs/transform.py"

# Storage Services
storage:
  s3:
    - name: "{project}-raw-{account-id}-{region}"
      versioning: true
      encryption: "AES256"
      cors: true
      lifecycle_policies:
        - transition_to_ia: 30
        - expire_noncurrent: 90

    - name: "{project}-processed-{account-id}-{region}"
      versioning: true
      encryption: "AES256"

  dynamodb:
    - name: "Users"
      billing_mode: "PAY_PER_REQUEST"
      point_in_time_recovery: true
      stream: "NEW_AND_OLD_IMAGES"
      partition_key: "PK"
      sort_key: "SK"
      gsi:
        - name: "EmailIndex"
          partition_key: "email"

    - name: "Documents"
      billing_mode: "PAY_PER_REQUEST"
      point_in_time_recovery: true
      partition_key: "PK"
      sort_key: "SK"
      gsi:
        - name: "UserDocumentsIndex"
          partition_key: "user_id"
          sort_key: "upload_date"

# API Services
api:
  api_gateway:
    - name: "MainAPI"
      type: "REST"
      endpoint_type: "REGIONAL"
      cors: true
      auth:
        type: "COGNITO"
        user_pool: "${UserPool}"
      throttling:
        rate_limit: 1000
        burst_limit: 2000
      resources:
        - path: "/users"
          methods: ["GET", "POST"]
          integration: "lambda"
          function: "api-handler"
        - path: "/documents"
          methods: ["GET", "POST", "DELETE"]
          integration: "lambda"
          function: "api-handler"

# Authentication Services
auth:
  cognito:
    - name: "UserPool"
      auto_verify: ["email"]
      mfa: "OPTIONAL"
      password_policy:
        min_length: 8
        require_uppercase: true
        require_lowercase: true
        require_numbers: true
        require_symbols: true
      attributes:
        - name: "email"
          required: true
          mutable: false
        - name: "name"
          required: true
          mutable: true

# Search Services
search:
  opensearch:
    - name: "DocumentSearch"
      version: "2.11"
      instance_type: "t3.small.search"
      instance_count: 1
      ebs_volume_size: 10
      ebs_volume_type: "gp3"
      encryption_at_rest: true
      node_to_node_encryption: true
      automated_snapshot_hour: 0

# Analytics Services
analytics:
  athena:
    - name: "DocumentAnalytics"
      workgroup: "primary"
      output_location: "s3://${ResultsBucket}/athena/"
      database: "documents_db"

# AI/ML Services
ml:
  bedrock:
    - model_id: "anthropic.claude-3-5-sonnet-20241022-v2:0"
      use_case: "Document summarization"
      guardrails: true

# Monitoring Services
monitoring:
  cloudwatch:
    log_groups:
      - name: "/aws/lambda/document-processor"
        retention_days: 7
      - name: "/aws/lambda/api-handler"
        retention_days: 7

    alarms:
      - name: "HighErrorRate"
        metric: "Errors"
        namespace: "AWS/Lambda"
        threshold: 10
        evaluation_periods: 1
        period: 300
        statistic: "Sum"
        comparison: "GreaterThanThreshold"
        actions:
          - type: "sns"
            topic: "${AlertsTopic}"

      - name: "HighCost"
        metric: "EstimatedCharges"
        namespace: "AWS/Billing"
        threshold: 100
        evaluation_periods: 1
        period: 86400
        statistic: "Maximum"
        comparison: "GreaterThanThreshold"

  sns:
    topics:
      - name: "Alerts"
        subscriptions:
          - protocol: "email"
            endpoint: "team@example.com"

# Networking
networking:
  vpc:
    enabled: false  # Set to true if Lambda needs VPC access
    # cidr: "10.0.0.0/16"
    # subnets:
    #   - type: "public"
    #     cidr: "10.0.1.0/24"
    #   - type: "private"
    #     cidr: "10.0.2.0/24"

# Cost Estimation
estimated_monthly_cost:
  lambda: 10  # USD
  dynamodb: 5
  s3: 2
  api_gateway: 3
  cognito: 0  # Free tier
  opensearch: 25
  cloudwatch: 2
  total: 47

# Tags
tags:
  Project: "${project_name}"
  Environment: "${environment}"
  ManagedBy: "CDK"
  CostCenter: "QuickStart"
