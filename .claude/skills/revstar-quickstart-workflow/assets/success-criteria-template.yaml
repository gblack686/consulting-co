# Feature-Specific Success Criteria
features:
  - name: "User Authentication"
    criteria:
      - id: "F1.1"
        description: "Users can register with email"
        test: "E2E test for registration flow"
        priority: "Critical"
        status: "pending"

      - id: "F1.2"
        description: "Users can login with credentials"
        test: "E2E test for login flow"
        priority: "Critical"
        status: "pending"

      - id: "F1.3"
        description: "Password reset flow works"
        test: "E2E test for password reset"
        priority: "High"
        status: "pending"

      - id: "F1.4"
        description: "MFA is optional and functional"
        test: "Manual testing of MFA flow"
        priority: "Medium"
        status: "pending"

  - name: "Document Management"
    criteria:
      - id: "F2.1"
        description: "Users can upload documents"
        test: "E2E test for document upload"
        priority: "Critical"
        status: "pending"

      - id: "F2.2"
        description: "Uploaded documents appear in list"
        test: "E2E test validates document in list"
        priority: "Critical"
        status: "pending"

      - id: "F2.3"
        description: "Users can view document details"
        test: "E2E test for document viewer"
        priority: "High"
        status: "pending"

      - id: "F2.4"
        description: "Users can download documents"
        test: "E2E test for download flow"
        priority: "High"
        status: "pending"

      - id: "F2.5"
        description: "Users can delete their documents"
        test: "E2E test for delete flow from Settings"
        priority: "Critical"
        status: "pending"

      - id: "F2.6"
        description: "Document appears in Settings > My Documents"
        test: "E2E test validates navigation to settings"
        priority: "High"
        status: "pending"

      - id: "F2.7"
        description: "Document processing completes successfully"
        test: "Integration test for Lambda processing"
        priority: "Critical"
        status: "pending"

# Performance Criteria
performance:
  - id: "P1"
    metric: "API Response Time"
    target: "< 200ms (p95)"
    measurement: "CloudWatch metrics"
    priority: "High"
    status: "pending"

  - id: "P2"
    metric: "Lambda Cold Start"
    target: "< 1 second"
    measurement: "CloudWatch logs"
    priority: "Medium"
    status: "pending"

  - id: "P3"
    metric: "Document Processing Time"
    target: "< 10 seconds for 10MB file"
    measurement: "CloudWatch logs"
    priority: "High"
    status: "pending"

  - id: "P4"
    metric: "Frontend Bundle Size"
    target: "< 500KB initial load"
    measurement: "Webpack bundle analyzer"
    priority: "Medium"
    status: "pending"

