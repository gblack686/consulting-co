# Success Criteria Template for RevStar QuickStart Projects

project_name: "Example Project"
version: "1.0"
poc_number: "POC2"

# Business Success Criteria
business:
  - id: "B1"
    category: "Functionality"
    criteria: "All core features implemented and working"
    measurement: "Manual testing of each feature"
    priority: "Critical"
    status: "pending"

  - id: "B2"
    category: "Performance"
    criteria: "Page load time < 2 seconds"
    measurement: "Lighthouse performance score > 90"
    priority: "High"
    status: "pending"

  - id: "B3"
    category: "User Experience"
    criteria: "Mobile responsive on all pages"
    measurement: "Manual testing on mobile devices"
    priority: "High"
    status: "pending"

  - id: "B4"
    category: "Cost"
    criteria: "Monthly AWS costs within budget ($100)"
    measurement: "AWS Cost Explorer monitoring"
    priority: "Critical"
    status: "pending"

