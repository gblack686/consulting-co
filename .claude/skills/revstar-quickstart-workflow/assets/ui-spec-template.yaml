# UI Specification Template for RevStar QuickStart Projects

project_name: "Example Project"
frontend_framework: "Next.js 14"  # Next.js, React, Vue, etc.
styling: "Tailwind CSS"
state_management: "React Context"  # Redux, Zustand, Context, etc.

# Pages
pages:
  - name: "Home"
    route: "/"
    auth_required: false
    components:
      - type: "Hero"
        content: "Welcome to {Project Name}"
      - type: "FeatureGrid"
        items: 3
      - type: "CTA"
        text: "Get Started"
        link: "/login"

  - name: "Login"
    route: "/login"
    auth_required: false
    components:
      - type: "LoginForm"
        fields:
          - name: "email"
            type: "email"
            required: true
            validation: "email"
          - name: "password"
            type: "password"
            required: true
            validation: "min:8"
        actions:
          - name: "Login"
            endpoint: "/api/auth/login"
            method: "POST"
            success_redirect: "/dashboard"
          - name: "Forgot Password"
            link: "/forgot-password"

  - name: "Dashboard"
    route: "/dashboard"
    auth_required: true
    layout: "sidebar"
    components:
      - type: "StatsCards"
        stats:
          - label: "Total Documents"
            value: "{documentCount}"
            icon: "DocumentIcon"
          - label: "Storage Used"
            value: "{storageUsed}"
            icon: "CloudIcon"
          - label: "Recent Activity"
            value: "{recentActivity}"
            icon: "ActivityIcon"
      - type: "RecentDocuments"
        limit: 5
        columns: ["title", "date", "status", "actions"]

  - name: "Documents"
    route: "/documents"
    auth_required: true
    layout: "sidebar"
    components:
      - type: "DocumentUpload"
        accept: ".pdf,.docx,.xlsx"
        max_size: "10MB"
        drag_drop: true
      - type: "DocumentList"
        pagination: true
        items_per_page: 20
        columns:
          - name: "title"
            sortable: true
            filterable: true
          - name: "upload_date"
            sortable: true
            format: "date"
          - name: "file_size"
            format: "bytes"
          - name: "status"
            badge: true
          - name: "actions"
            buttons: ["view", "download", "delete"]

  - name: "Document Details"
    route: "/documents/[id]"
    auth_required: true
    layout: "sidebar"
    components:
      - type: "DocumentViewer"
        supported_types: ["pdf", "image"]
      - type: "DocumentMetadata"
        editable: true
        fields:
          - "title"
          - "description"
          - "tags"
      - type: "DocumentActions"
        actions:
          - name: "Download"
            icon: "DownloadIcon"
          - name: "Share"
            icon: "ShareIcon"
          - name: "Delete"
            icon: "TrashIcon"
            confirm: true

  - name: "Settings"
    route: "/settings"
    auth_required: true
    layout: "sidebar"
    tabs:
      - name: "Profile"
        route: "/settings/profile"
        components:
          - type: "ProfileForm"
            fields:
              - name: "name"
                type: "text"
                editable: true
              - name: "email"
                type: "email"
                editable: false
              - name: "avatar"
                type: "image"
                upload: true

      - name: "My Documents"
        route: "/settings/documents"
        components:
          - type: "DocumentList"
            columns: ["title", "date", "actions"]
            actions:
              - name: "Delete"
                confirm: true
                success_message: "Document deleted"

      - name: "Security"
        route: "/settings/security"
        components:
          - type: "PasswordChange"
            fields:
              - "current_password"
              - "new_password"
              - "confirm_password"
          - type: "MFASettings"
            toggle: true

# Components Library
components:
  forms:
    - name: "LoginForm"
      validation: "client-side + server-side"
      error_handling: "inline + toast"
      loading_states: true

    - name: "DocumentUpload"
      features:
        - drag_drop: true
        - progress_bar: true
        - preview: true
        - multiple_files: true

  layout:
    - name: "Sidebar"
      responsive: true
      collapsible: true
      items:
        - label: "Dashboard"
          icon: "HomeIcon"
          link: "/dashboard"
        - label: "Documents"
          icon: "DocumentIcon"
          link: "/documents"
        - label: "Settings"
          icon: "SettingsIcon"
          link: "/settings"

  navigation:
    - name: "Navbar"
      logo: true
      user_menu: true
      notifications: true
      mobile_responsive: true

# User Flows
user_flows:
  - name: "Document Upload Flow"
    steps:
      - page: "Documents"
        action: "Click upload button"
        next: "Upload modal opens"
      - page: "Upload Modal"
        action: "Select file or drag & drop"
        next: "File preview shows"
      - page: "Upload Modal"
        action: "Click 'Upload' button"
        next: "Progress bar shows"
      - page: "Upload Modal"
        condition: "Upload complete"
        next: "Modal closes, document appears in list"
      - page: "Documents"
        validation: "Document visible in list"
      - page: "Settings > My Documents"
        validation: "Document visible in settings"

  - name: "Document Delete Flow"
    steps:
      - page: "Settings > My Documents"
        action: "Click delete button"
        next: "Confirmation modal opens"
      - page: "Confirmation Modal"
        action: "Click 'Confirm' button"
        next: "Document deleted"
      - page: "Settings > My Documents"
        validation: "Document removed from list"
      - page: "Documents"
        validation: "Document removed from list"

  - name: "Authentication Flow"
    steps:
      - page: "Login"
        action: "Enter credentials"
        next: "Click login"
      - page: "Login"
        condition: "Valid credentials"
        next: "Redirect to dashboard"
      - page: "Dashboard"
        validation: "User logged in, stats visible"
      - page: "Any Page"
        condition: "Session expired"
        next: "Redirect to login"

