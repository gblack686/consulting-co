# Responsive Design
responsive:
  breakpoints:
    mobile: "< 640px"
    tablet: "640px - 1024px"
    desktop: "> 1024px"

  mobile_considerations:
    - Collapsible sidebar
    - Stack stats cards vertically
    - Simplified table view
    - Bottom navigation for key actions
    - Full-screen modals

# Accessibility
accessibility:
  - WCAG 2.1 AA compliance
  - Keyboard navigation
  - Screen reader support
  - Color contrast ratios
  - Focus indicators
  - ARIA labels

# Performance
performance:
  - Code splitting by route
  - Image optimization (next/image)
  - Lazy loading for heavy components
  - API response caching
  - Client-side state caching
  - Prefetch critical routes

# Testing Requirements
testing:
  unit:
    - Component rendering
    - Form validation
    - State management

  integration:
    - API integration
    - Form submission
    - Navigation flows

  e2e:
    - Complete user flows
    - Multi-page interactions
    - Error scenarios
    - Mobile responsiveness

# Design Tokens
design_tokens:
  colors:
    primary: "#3B82F6"
    secondary: "#8B5CF6"
    success: "#10B981"
    warning: "#F59E0B"
    error: "#EF4444"
    background: "#F9FAFB"
    text: "#111827"

  typography:
    font_family: "Inter, sans-serif"
    heading_1: "32px"
    heading_2: "24px"
    heading_3: "20px"
    body: "16px"
    small: "14px"

  spacing:
    xs: "4px"
    sm: "8px"
    md: "16px"
    lg: "24px"
    xl: "32px"

  border_radius:
    sm: "4px"
    md: "8px"
    lg: "12px"
    full: "9999px"
