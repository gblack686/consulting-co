version: '3.8'

services:
  orchestrator-backend:
    build:
      context: ./orchestrator_3_stream/backend
      dockerfile: Dockerfile
    container_name: orchestrator-backend
    security_opt:
      - seccomp=unconfined
    network_mode: host
    volumes:
      # Mount entire orchestrator directory to access orchestrator_db
      - .:/workspace
      # Mount backend code as working directory
      - ./orchestrator_3_stream/backend:/app
      # Mount .env file (read-only)
      - ./orchestrator_3_stream/.env:/app/.env:ro
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
      - BACKEND_PORT=8000
      - PYTHONPATH=/workspace
      - DATABASE_URL=postgresql://postgres.unickqnwfheaczccvgbw:G^qjC7F$$@P65DqpN*mmv@54.177.55.191:6543/postgres
      - FRONTEND_PORT=3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
