<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Viewer - Orchestrator Logs</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1>Log Viewer</h1>
                <span class="subtitle">Unified Orchestrator Log Browser</span>
            </div>
            <div class="header-right">
                <div class="stats" id="stats">
                    <span class="stat">
                        <span class="stat-label">Total:</span>
                        <span class="stat-value" id="stat-total">-</span>
                    </span>
                    <span class="stat agent-logs">
                        <span class="stat-label">Agent:</span>
                        <span class="stat-value" id="stat-agent">-</span>
                    </span>
                    <span class="stat system-logs">
                        <span class="stat-label">System:</span>
                        <span class="stat-value" id="stat-system">-</span>
                    </span>
                    <span class="stat orchestrator-chat">
                        <span class="stat-label">Chat:</span>
                        <span class="stat-value" id="stat-chat">-</span>
                    </span>
                </div>
                <button id="refresh-btn" class="btn btn-primary" title="Refresh logs">Refresh</button>
            </div>
        </header>

        <!-- Filters -->
        <div class="filters">
            <div class="filter-group">
                <label for="source-filter">Source:</label>
                <select id="source-filter">
                    <option value="">All Sources</option>
                    <option value="agent_logs">Agent Logs</option>
                    <option value="system_logs">System Logs</option>
                    <option value="orchestrator_chat">Orchestrator Chat</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="event-type-filter">Event Type:</label>
                <select id="event-type-filter">
                    <option value="">All Types</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="level-filter">Level:</label>
                <select id="level-filter">
                    <option value="">All Levels</option>
                    <option value="DEBUG">DEBUG</option>
                    <option value="INFO">INFO</option>
                    <option value="WARNING">WARNING</option>
                    <option value="ERROR">ERROR</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="sender-filter">Sender:</label>
                <select id="sender-filter">
                    <option value="">All Senders</option>
                    <option value="user">User</option>
                    <option value="orchestrator">Orchestrator</option>
                    <option value="agent">Agent</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="hours-filter">Time Range:</label>
                <select id="hours-filter">
                    <option value="">All Time</option>
                    <option value="1">Last 1 hour</option>
                    <option value="6">Last 6 hours</option>
                    <option value="24">Last 24 hours</option>
                    <option value="48">Last 48 hours</option>
                    <option value="168">Last 7 days</option>
                </select>
            </div>

            <div class="filter-group search-group">
                <label for="search-filter">Search:</label>
                <input type="text" id="search-filter" placeholder="Search messages...">
            </div>

            <div class="filter-group">
                <label for="limit-filter">Limit:</label>
                <select id="limit-filter">
                    <option value="50">50</option>
                    <option value="100" selected>100</option>
                    <option value="250">250</option>
                    <option value="500">500</option>
                    <option value="1000">1000</option>
                </select>
            </div>
        </div>

        <!-- Log Table -->
        <div class="log-container">
            <table class="log-table">
                <thead>
                    <tr>
                        <th class="col-timestamp">Timestamp</th>
                        <th class="col-source">Source</th>
                        <th class="col-type">Type</th>
                        <th class="col-sender">Sender</th>
                        <th class="col-message">Message</th>
                        <th class="col-actions">Actions</th>
                    </tr>
                </thead>
                <tbody id="log-body">
                    <tr class="loading-row">
                        <td colspan="6">Loading logs...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Detail Modal -->
        <div id="detail-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modal-title">Log Details</h2>
                    <button class="modal-close" id="modal-close">&times;</button>
                </div>
                <div class="modal-body" id="modal-body">
                    <!-- Content will be injected -->
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
