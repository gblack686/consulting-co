# ============================================================
# Cross-Account Access Pattern
# ============================================================
cross_account_access:
  why: "Root account cannot assume roles directly. Must create a temp IAM user."
  role: "OrganizationAccountAccessRole"
  note: "Auto-created by AWS Organizations when sub-account is created via organizations:CreateAccount"

  workflow:
    step_1: "Create temp IAM user in management account (274487662938)"
    step_2: "Attach AdministratorAccess policy to temp user"
    step_3: "Create access key for temp user"
    step_4: "Use temp user credentials to assume OrganizationAccountAccessRole in target sub-account"
    step_5: "Execute IAM operations in sub-account using assumed role session credentials"
    step_6: "Delete temp user access key, detach policy, delete user"

  critical_rules:
    - "ALWAYS delete temp user immediately after use"
    - "NEVER store temp user credentials"
    - "NEVER leave temp user alive between sessions"
    - "Assumed role sessions expire in 1 hour by default"

# ============================================================
# Least-Privilege Policy Templates
# ============================================================
policy_templates:
  lightsail_basic:
    name: "LightsailAccess"
    description: "Create, manage, and delete Lightsail instances"
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [{
          "Effect": "Allow",
          "Action": [
            "lightsail:CreateInstances",
            "lightsail:GetInstance",
            "lightsail:GetInstances",
            "lightsail:GetKeyPair",
            "lightsail:CreateKeyPair",
            "lightsail:OpenInstancePublicPorts",
            "lightsail:CloseInstancePublicPorts",
            "lightsail:DeleteInstance",
            "lightsail:GetBundles",
            "lightsail:GetBlueprints",
            "lightsail:StartInstance",
            "lightsail:StopInstance",
            "lightsail:RebootInstance"
          ],
          "Resource": "*"
        }]
      }

  lightsail_readonly:
    name: "LightsailReadOnly"
    description: "View Lightsail instances only"
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [{
          "Effect": "Allow",
          "Action": [
            "lightsail:GetInstance",
            "lightsail:GetInstances",
            "lightsail:GetBundles",
            "lightsail:GetBlueprints",
            "lightsail:GetKeyPair"
          ],
          "Resource": "*"
        }]
      }

  lightsail_networking:
    name: "LightsailNetworking"
    description: "Manage Lightsail networking (static IPs, domains, load balancers)"
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [{
          "Effect": "Allow",
          "Action": [
            "lightsail:AllocateStaticIp",
            "lightsail:AttachStaticIp",
            "lightsail:DetachStaticIp",
            "lightsail:ReleaseStaticIp",
            "lightsail:GetStaticIp",
            "lightsail:GetStaticIps",
            "lightsail:CreateDomain",
            "lightsail:GetDomain",
            "lightsail:GetDomains",
            "lightsail:CreateLoadBalancer",
            "lightsail:GetLoadBalancer"
          ],
          "Resource": "*"
        }]
      }

  secrets_readonly:
    name: "SecretsReadOnly"
    description: "Read secrets from Secrets Manager (no create/delete)"
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [{
          "Effect": "Allow",
          "Action": [
            "secretsmanager:GetSecretValue",
            "secretsmanager:ListSecrets",
            "secretsmanager:DescribeSecret"
          ],
          "Resource": "*"
        }]
      }

  s3_bucket_scoped:
    name: "S3BucketScoped"
    description: "Access a specific S3 bucket only"
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [{
          "Effect": "Allow",
          "Action": ["s3:GetObject", "s3:PutObject", "s3:ListBucket", "s3:DeleteObject"],
          "Resource": [
            "arn:aws:s3:::{BUCKET_NAME}",
            "arn:aws:s3:::{BUCKET_NAME}/*"
          ]
        }]
      }

# ============================================================
# Forbidden Actions (NEVER grant to sub-accounts)
# ============================================================
security_rules:
  never_grant:
    - "iam:*                     # No IAM self-modification"
    - "organizations:*           # No org-level access"
    - "sts:AssumeRole (to management account roles)"
    - "aws-portal:*              # No billing access"
    - "account:*                 # No account settings"
    - "support:*                 # No support case creation"

  always_apply:
    - "Use inline policies (not managed) for sub-account users - easier to audit"
    - "One policy per service - never combine unrelated services"
    - "Name policies descriptively: {Service}{Scope} (e.g., LightsailAccess, S3ReadOnly)"
    - "Review and prune permissions quarterly"
    - "Store sub-account credentials in management account Secrets Manager"
    - "Never store management/root credentials on sub-account instances"

  sub_account_creation:
    - "Always use email alias: gblack686+{purpose}@gmail.com"
    - "Name format: {purpose}-{env} (e.g., openclaw-prod, eagle-demo)"
    - "Start with zero IAM policies - add only what's needed"
    - "Document every policy grant in expertise.yaml"

