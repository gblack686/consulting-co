      - id: "glm-5"
        name: "GLM-5"
        reasoning: true
        context_window: 204800
        max_tokens: 131072
        cost: "Free (coding plan)"
      - id: "glm-4.7"
        name: "GLM-4.7"
        reasoning: true
        context_window: 204800
