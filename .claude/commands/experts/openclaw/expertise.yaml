# OpenClaw Installation
installation:
  official_installer:
    macos_linux: "curl -fsSL https://openclaw.ai/install.sh | bash"
    windows: "iwr -useb https://openclaw.ai/install.ps1 | iex"
    note: "Handles Homebrew, Node.js 22, and OpenClaw install automatically"
  manual:
    - "npm install -g openclaw@latest"
    - "openclaw onboard --non-interactive --accept-risk --flow quickstart --auth-choice zai-api-key --zai-api-key <key> --install-daemon --skip-channels"
  onboard_flags:
    auth_choices: "zai-api-key, openrouter-api-key, anthropic-api-key, gemini-api-key, custom-api-key, ollama, skip"
    key_flags: "--non-interactive --accept-risk --flow quickstart --install-daemon --skip-channels --skip-skills --skip-search --skip-ui"
    gateway_flags: "--gateway-auth token --gateway-bind loopback --gateway-port 18789"
  reference: ".claude/commands/experts/openclaw/INSTALLATION_GUIDE.md"
  mac_mini_guide: ".claude/skills/consulting-intake/templates/mac-mini-install.md"

