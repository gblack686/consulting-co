# Consulting Pipeline Patterns
consulting_patterns:
  morning_brief:
    description: "Default quick-win domain — get one working Telegram notification within 24 hours"
    skill: "morning-brief (always included in skill entries)"
    note: "Universally useful; builds client confidence fast"

  discord_user_token:
    description: "For signal feed channels, use Discord user token (not bot token)"
    pattern: "Extract user token from browser DevTools → Application → Local Storage → discord.com → token"
    why: "Bot tokens require OAuth flow + guild admin invite; user tokens see everything the user sees"
    security: "User tokens violate Discord ToS — inform client of risk, never use on primary account"

  zero_touch_bootstrap:
    description: "Post-deploy checklist for automated instance setup"
    steps:
      - "1. Secrets discovery — scan session for all API keys mentioned"
      - "2. Batch injection — openclaw config set env.KEY value for each"
      - "3. API key validation — curl each provider endpoint"
      - "4. Channel test — send test message via each configured channel"
      - "5. Skill deploy — copy skills to workspace/skills/"
      - "6. Cron setup — configure scheduled jobs"
    note: "Goal: client sends zero follow-up questions after deploy"

  soul_shaping:
    description: "Extract verbatim communication style preferences from intake sessions"
    pattern: "Pull exact quotes from transcript where client describes desired agent personality"
    output: "SOUL.md with personality traits, tone rules, and example responses"
    reference: "onlycrabs.ai for community SOUL templates"

  github_org:
    pattern: "Client repos under gbauto/ org (not personal gblack686/)"
    repo_naming: "gbauto/{client-slug} — e.g. gbauto/greg-trading"
