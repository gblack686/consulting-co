# Troubleshooting
troubleshooting:
  common_issues:
    - issue: "Config set returns 'unknown command set'"
      cause: "Using 'openclaw secrets set' — wrong command"
      fix: "Use 'openclaw config set env.KEY value' instead"

    - issue: "Telegram bot not responding"
      cause: "allowFrom empty or dmPolicy not configured"
      fix: "openclaw config set channels.telegram.allowFrom '[\"CHAT_ID\"]'"

    - issue: "Gateway won't start on macOS"
      cause: "Port conflict or plist not loaded"
      fix: "launchctl list | grep openclaw; openclaw gateway restart"

    - issue: "Memory search not ready"
      cause: "No embedding provider configured"
      fix: "openclaw config set agents.defaults.memorySearch.enabled false"

    - issue: "Skills not found"
      cause: "Skills not in workspace/skills/ directory"
      fix: "mkdir -p ~/.openclaw/workspace/skills && ls ~/.openclaw/workspace/skills/"

    - issue: "SSH can't run sudo on macOS"
      cause: "sudo requires terminal for password"
      fix: "Add NOPASSWD to sudoers: sudo visudo -f /etc/sudoers.d/greg"

    - issue: "Homebrew install fails via SSH"
      cause: "Nested quotes break in SSH"
      fix: "Use official installer: curl -fsSL https://openclaw.ai/install.sh -o /tmp/install.sh && bash /tmp/install.sh"

    - issue: "SSH connection timed out to Mac Mini"
      cause: "DHCP lease renewed and IP changed"
      fix: "Use mDNS hostname: ssh greg@Gregs-Mac-mini.local — or set static IP in router"

    - issue: "Config validation error: Unrecognized key"
      cause: "Config has keys from older/newer OpenClaw version"
      fix: "openclaw doctor --fix --non-interactive"

    - issue: "CRITICAL: Elevated exec allowlist contains wildcard"
      cause: "tools.elevated.allowFrom.telegram includes '*'"
      fix: "openclaw config set tools.elevated.allowFrom.telegram '[\"6777263736\"]'"

    - issue: "Steer can't click or take screenshots"
      cause: "Missing macOS permissions"
      fix: "System Settings → Privacy & Security → Accessibility + Screen Recording → add Terminal"

