# OpenClaw Commands
commands:
  gateway:
    description: "Manage the gateway service"
    commands:
      start: "openclaw gateway"
      restart: "openclaw gateway restart"
      status: "launchctl list | grep openclaw"
    note: "On Mac Mini: launchd service ai.openclaw.gateway. On Linux: systemctl --user"

  doctor:
    description: "Health check"
    command: "openclaw doctor --non-interactive"
    fix: "openclaw doctor --fix"

  config:
    description: "Non-interactive config management"
    subcommands:
      get: "openclaw config get <key>"
      set: "openclaw config set <key> <value>"
      unset: "openclaw config unset <key>"
      validate: "openclaw config validate"
    note: "Use for setting env vars, channel config, model settings without interactive wizard"

  configure:
    description: "Interactive setup wizard"
    command: "openclaw configure"
    sections: "--section model | --section channels | --section web"

  channels:
    description: "List configured channels"
    command: "openclaw channels list"

  message:
    description: "Send messages via channels"
    command: "openclaw message send --channel telegram --target <chat_id> --message <text>"
    flags: "--json, --dry-run, --media <path-or-url>, --silent, --buttons <json>, --reply-to <id>"
    channels: "telegram, discord, whatsapp, slack, signal, irc, googlechat, msteams, matrix, and more"

  skills:
    description: "Skill management"
    command: "openclaw skills list"
    install: "npx clawhub search <query> && npx clawhub install <skill>"
    clawhub: "clawhub.ai — 1,700+ community skills. Always check VirusTotal report before installing (~5% contain threats)"

  agents:
    description: "Agent identity management"
    subcommands:
      list: "openclaw agents list"
      add: "openclaw agents add <id>"

  cron:
    description: "Scheduled job management"
    subcommands:
      list: "openclaw cron list"
      add: "openclaw cron add"

  secrets:
    description: "Secrets runtime controls (NOT for setting secrets — use config set)"
    subcommands:
      audit: "openclaw secrets audit"
      reload: "openclaw secrets reload"
      configure: "openclaw secrets configure"
    note: "To set secrets, use: openclaw config set env.SECRET_NAME 'value'"

  dashboard:
    description: "Open the Control UI"
    command: "openclaw dashboard"
    url: "http://localhost:18789/?token=<gateway-token>"
    tunnel: "ssh -L 18789:127.0.0.1:18789 greg@Gregs-Mac-mini.local"

  security:
    description: "Security audit"
    command: "openclaw security audit --deep"

  memory:
    description: "Memory management"
    subcommands:
      status: "openclaw memory status --deep"
    note: "Requires embedding provider (OpenAI, Gemini, Voyage, or Mistral). Disable with: openclaw config set agents.defaults.memorySearch.enabled false"

# OpenClaw Configuration (openclaw.json)
config:
  format: "JSON (supports JSON5 comments in templates)"
  file_path: "~/.openclaw/openclaw.json"
  backup: "~/.openclaw/openclaw.json.bak (auto-created on each config set)"

  key_config_sections:
    gateway:
      port: 18789
      mode: "local | remote"
      bind: "loopback | lan | tailnet | custom"
      auth: "token | password | none | trusted-proxy"
    channels:
      telegram: "dmPolicy: pairing|allowlist|open, allowFrom: [chat_ids], streaming: partial"
      discord: "groupPolicy: allowlist|open, streaming: off|partial|block"
      whatsapp: "dmPolicy: allowlist, pairing via QR code"
    agents:
      defaults:
        model: "primary + fallbacks"
        heartbeat: "every, target, ackMaxChars"
        subagents: "model, archiveAfterMinutes, maxSpawnDepth, maxConcurrent"
        contextPruning: "mode: cache-ttl, ttl, keepLastAssistants, softTrimRatio"
        compaction: "mode: safeguard, memoryFlush with softThresholdTokens"
        sandbox: "mode: off|non-main|all, docker/ssh/openshell"
    session:
      dmScope: "per-channel-peer (recommended)"
      reset: "mode: daily|idle, atHour"
      maintenance: "pruneAfter, maxEntries"
    logging:
      redactSensitive: "tools | all | off"
    tools:
      profile: "minimal | coding | messaging | full"
      elevated: "enabled, allowFrom per channel (telegram/discord/session/*)"
      loopDetection: "enabled, historySize, warningThreshold, criticalThreshold, globalCircuitBreakerThreshold"
      web: "search (Brave API), fetch with caching"
    commands:
      native: "auto"
      nativeSkills: "auto"
      restart: true
    plugins:
      entries: "damage-control, channel plugins, custom plugins"
      note: "9/41 loaded on Mac Mini (discord, telegram, memory-core, ollama, sglang, vllm, device-pair, phone-control, talk-voice)"
    cron:
      jobs: "every, to, prompt, model, sessionTarget: main|isolated"
    bindings:
      note: "Multi-agent routing by channel/peer/account"
    messages:
      responsePrefix: "Supports {model}, {provider}, {identity.name} templates"
      queue: "mode: steer|followup|collect|interrupt|queue"
      tts: "ElevenLabs or OpenAI providers"

  auth:
    methods:
      - "Plaintext in config env section"
      - "Environment variable substitution: ${VAR_NAME}"
      - "SecretRef objects with source (env|file|exec)"
    precedence: "Agent config > Channel config > Global config > Env fallback"

# Mac Mini Agent (GUI + Terminal Automation)
mac_mini_agent:
  repo: "~/mac-mini-agent (github.com/disler/mac-mini-agent)"
  description: "Full macOS GUI and terminal automation for AI agents"

  steer:
    binary: "/usr/local/bin/steer"
    language: "Swift"
    commands: 14
    key_commands:
      see: "Screenshot + accessibility tree (--json for structured output)"
      click: "Click by element ID, label, or coordinates"
      type: "Type into focused or targeted element"
      hotkey: "Send keyboard shortcuts (cmd+s, cmd+tab)"
      ocr: "Vision framework OCR — essential for Electron apps"
      apps: "List, launch, activate applications"
      window: "Move, resize, minimize, fullscreen, close"
    pattern: "Observe-Act-Verify loop — ONE steer command per call, always verify after"
    permissions_needed:
      - "System Settings → Privacy & Security → Accessibility → Terminal"
      - "System Settings → Privacy & Security → Screen Recording → Terminal"

  drive:
    location: "~/mac-mini-agent/apps/drive (uv project)"
    language: "Python"
    commands: 6
    key_commands:
      session: "Create, list, kill tmux sessions"
      run: "Execute command with sentinel protocol (deterministic completion)"
      send: "Send raw keystrokes (interactive CLIs)"
      logs: "Capture pane output"
      poll: "Wait for regex pattern in output"
      fanout: "Same command across multiple sessions"
      proc: "Process management (list, kill, tree, top)"

  listen:
    location: "~/mac-mini-agent/apps/listen (uv project, FastAPI)"
    port: 7600
    endpoints:
      submit: "POST /job {prompt}"
      status: "GET /job/{id}"
      list: "GET /jobs"
      stop: "DELETE /job/{id}"
    note: "Fire-and-forget worker model — spawns Claude Code per job"

  direct:
    location: "~/mac-mini-agent/apps/direct (uv project)"
    commands: "start, get, list, latest, stop"

