# Runtime (macOS launchd)
runtime:
  macos:
    service_name: "ai.openclaw.gateway"
    plist: "~/Library/LaunchAgents/ai.openclaw.gateway.plist"
    commands:
      status: "launchctl list | grep openclaw"
      restart: "openclaw gateway restart"
      logs: "tail -f ~/.openclaw/logs/gateway.log"
    note: "Auto-installed by openclaw onboard --install-daemon"
  linux:
    service_name: "openclaw-gateway"
    type: "systemd user service"
    path: "~/.config/systemd/user/openclaw-gateway.service"
    commands:
      status: "systemctl --user status openclaw-gateway"
      restart: "systemctl --user restart openclaw-gateway"
      logs: "journalctl --user -u openclaw-gateway -f"
    note: "Requires loginctl enable-linger for persistence"

